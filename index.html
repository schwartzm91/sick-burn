<!DOCTYPE html>
<html lang="en">
<head>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  /* Pick card */

  /* Leaderboard */
  .lb-row {

  .lb-rank.silver { background: #9e9e9e30; color: #bdbdbd; }
  .lb-rank.bronze { background: #8d6e6330; color: #bcaaa4; }

  .lb-name { font-weight: 600; font-size: 14px; flex: 1; }

  .lb-record {

  .lb-pct {

    font-weight: 800;

  /* Week history */
  .week-row {
    display: flex;
    align-items: center;

  .week-num {

  .week-odds {

  /* Admin */
  .admin-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .admin-row input { flex: 1; }

  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;

  /* Deadline banner */
  .deadline-banner {
    background: linear-gradient(135deg, #ff525230 0%, #ff980030 100%);
    border: 1px solid var(--red);
    border-radius: 10px;
    padding: 14px;

  }

  .deadline-text {
    font-size: 13px;

    color: var(--red);
  }

  .countdown {
    font-size: 20px;

  /* Empty state */
  .empty {
    text-align: center;
    padding: 40px 20px;

  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; }

  /* Parlay summary */
  .parlay-box {
    background: linear-gradient(135deg, var(--surface2) 0%, #1a2340 100%);
    border: 1px solid var(--gold);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    margin-bottom: 12px;

  .parlay-label {
    font-size: 11px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1px;

  .parlay-odds {

    font-weight: 900;

  .parlay-payout {

    color: var(--green);

  .badge-hot {

    gap: 4px;
    padding: 2px 8px;

    font-weight: 700;
    color: var(--green);

  .badge-cold {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    background: var(--red-dim);
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    color: var(--red);

  /* Responsive */
  @media (max-width: 480px) {
    .container { padding: 12px; }
    .stat-value { font-size: 18px; }
    .parlay-odds { font-size: 28px; }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

// ─── Helpers ──────────────────────────────────────────────────
function americanToDecimal(odds) {
  if (odds > 0) return (odds / 100) + 1;
  return (100 / Math.abs(odds)) + 1;
}

function formatOdds(odds) {
  return odds > 0 ? `+${odds}` : `${odds}`;
}

function combinedParlayOdds(picks) {
  if (picks.length === 0) return 0;
  let decimal = 1;
  picks.forEach(p => { decimal *= americanToDecimal(p.odds); });
  // Convert back to American
  if (decimal >= 2) return Math.round((decimal - 1) * 100);
  return Math.round(-100 / (decimal - 1));
}

function parlayDecimal(picks) {
  if (picks.length === 0) return 1;
  let d = 1;
  picks.forEach(p => { d *= americanToDecimal(p.odds); });
  return d;
}

function getDeadline(week) {
  // 2026 NFL season: Week 1 starts Sept 10.
  // Saturday 9 AM ET deadline for each week
  const base = new Date(2026, 8, 12, 9, 0, 0); // Sept 12 2026 Sat 9 AM
  base.setDate(base.getDate() + (week - 1) * 7);
  return base;
}

function isLocked(week) {
  return new Date() >= getDeadline(week);
}

function timeUntilDeadline(week) {
  const dl = getDeadline(week);
  const now = new Date();
  const diff = dl - now;
  if (diff <= 0) return 'LOCKED';
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  if (d > 0) return `${d}d ${h}h ${m}m`;
  return `${h}h ${m}m`;
}

const AVATAR_COLORS = [
  '#7c4dff','#448aff','#00e676','#ffc107','#ff5252','#e040fb','#ff6e40','#00bcd4',
  '#76ff03','#ff4081','#536dfe','#ffab40','#69f0ae','#ea80fc','#b388ff'
];

function getInitials(name) {
  return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);
}

// ─── Conflict detection ──────────────────────────────────────
function getConflictKey(pick) {
  // Identify the "side" — returns a key for conflict grouping
  const { game, betType, pickText } = pick;
  return `${game}|${betType}|${pickText}`.toLowerCase();
}

function getOppositeSide(pick) {
  const { game, betType, pickText } = pick;
  const text = pickText.toLowerCase().trim();
  // Spread: opposite is other team at opposite spread
  if (betType === 'spread') {
    const parts = game.split(' @ ');
    if (!parts[1]) return null;
    // Check which team is in the pick
    const away = parts[0].toLowerCase();
    const home = parts[1].toLowerCase();
    const spreadMatch = text.match(/([a-z]{2,3})\s+([+-]?\d+\.?\d*)/i);
    if (spreadMatch) {
      const team = spreadMatch[1].toLowerCase();
      const spread = parseFloat(spreadMatch[2]);
      const otherTeam = team === away ? parts[1] : parts[0];
      return `${game}|${betType}|${otherTeam} ${spread > 0 ? '-' : '+'}${Math.abs(spread)}`.toLowerCase();
    }
  }
  // Over/Under
  if (betType === 'over/under') {
    if (text.includes('over')) return `${game}|${betType}|${text.replace('over','under')}`.toLowerCase();
    if (text.includes('under')) return `${game}|${betType}|${text.replace('under','over')}`.toLowerCase();
  }
  // Moneyline: opposite team
  if (betType === 'moneyline') {
    const parts = game.split(' @ ');
    if (parts.length === 2) {
      const away = parts[0].toLowerCase();
      const home = parts[1].toLowerCase();
      if (text.includes(away)) return `${game}|${betType}|${home}`.toLowerCase();
      if (text.includes(home)) return `${game}|${betType}|${away}`.toLowerCase();
    }
  }
  return null;
}

// ─── Data store (localStorage) ────────────────────────────────
function loadData() {
  try {
    const raw = localStorage.getItem('parlay-tracker-data');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return {
    players: ['Matteo','Pronchik','Schwartz','Thurston','Herlihy','Marchi','Daley','Berry','Kirstein','Peck','Madrazo','Conte','Brooks','Hume'],
    currentWeek: 2,
    buyIn: 5,
    weeks: {},      // { [weekNum]: { picks: [], result: null, payout: 0 } }
    adminPin: '1234',
  };
}

function saveData(data) {
  try { localStorage.setItem('parlay-tracker-data', JSON.stringify(data)); } catch(e) {}
}

// ─── Main App ─────────────────────────────────────────────────
function App() {
  const [data, setData] = useState(loadData);
  const [tab, setTab] = useState('picks');

  const update = useCallback((fn) => {
    setData(prev => {
      const next = { ...prev };
      fn(next);
      saveData(next);
      return next;
    });
  }, []);

  const weekData = data.weeks[data.currentWeek] || { picks: [], result: null, payout: 0 };

  const tabs = [
    { id: 'picks', icon: '🏈', label: 'Submit' },
    { id: 'weekly', icon: '📋', label: 'This Week' },
    { id: 'dashboard', icon: '📊', label: 'Season' },
    { id: 'leaderboard', icon: '🏆', label: 'Board' },
    { id: 'admin', icon: '⚙️', label: 'Admin' },
  ];

  return (
    <div>
      <header className="app-header">
        <div className="app-title">🔥 SICK BURN 🔥</div>
        <div className="app-subtitle">Group Parlay • 2026 NFL Season • Week {data.currentWeek}</div>
      </header>

      <div className="tab-bar">
        {tabs.map(t => (
          <button key={t.id} className={`tab ${tab === t.id ? 'active' : ''}`} onClick={() => setTab(t.id)}>
            <span className="tab-icon">{t.icon}</span>
            {t.label}
          </button>
        ))}
      </div>

      <div className="container">
        {tab === 'picks' && <PicksTab data={data} update={update} weekData={weekData} />}
        {tab === 'weekly' && <WeeklyTab data={data} weekData={weekData} />}
        {tab === 'dashboard' && <DashboardTab data={data} />}
        {tab === 'leaderboard' && <LeaderboardTab data={data} />}
        {tab === 'admin' && <AdminTab data={data} update={update} />}
      </div>
    </div>
  );
}

// ─── PICKS TAB ────────────────────────────────────────────────
function PicksTab({ data, update, weekData }) {
  const [player, setPlayer] = useState('');
  const [game, setGame] = useState('');
  const [betType, setBetType] = useState('spread');
  const [pickText, setPickText] = useState('');
  const [odds, setOdds] = useState('-110');
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');
  const [editingIdx, setEditingIdx] = useState(null);

  const locked = isLocked(data.currentWeek);
  const countdown = timeUntilDeadline(data.currentWeek);

  // Live update countdown
  const [, setTick] = useState(0);
  useEffect(() => {
    const timer = setInterval(() => setTick(t => t + 1), 60000);
    return () => clearInterval(timer);
  }, []);

  const alreadyPicked = weekData.picks.map(p => p.player);

  function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setSuccess('');

    if (!player || !game || !pickText.trim() || !odds) {
      setError('Fill in all fields.');
      return;
    }

    if (editingIdx === null && alreadyPicked.includes(player)) {
      setError(`${player} already submitted a pick this week.`);
      return;
    }

    const parsedOdds = parseInt(odds);
    if (isNaN(parsedOdds) || parsedOdds === 0 || (parsedOdds > -100 && parsedOdds < 100)) {
      setError('Enter valid American odds (e.g., -110, +150). Must be ≤ -100 or ≥ +100.');
      return;
    }

    // Conflict check
    const newPick = { player, game, betType, pickText: pickText.trim(), odds: parsedOdds };
    const newKey = getConflictKey(newPick);
    const oppositeKey = getOppositeSide(newPick);

    for (let ei = 0; ei < weekData.picks.length; ei++) {
      if (ei === editingIdx) continue; // skip the pick being edited
      const existing = weekData.picks[ei];
      const existingKey = getConflictKey(existing);
      if (oppositeKey && existingKey === oppositeKey) {
        setError(`Conflicting pick — ${existing.player} already has "${existing.pickText}" (${existing.betType}). Choose a different bet.`);
        return;
      }
    }

    update(d => {
      if (!d.weeks[d.currentWeek]) {
        d.weeks[d.currentWeek] = { picks: [], result: null, payout: 0 };
      }
      if (editingIdx !== null) {
        // Replace existing pick
        d.weeks[d.currentWeek].picks[editingIdx] = {
          ...newPick,
          result: 'pending',
          submittedAt: new Date().toISOString(),
        };
      } else {
        d.weeks[d.currentWeek].picks.push({
          ...newPick,
          result: 'pending',
          submittedAt: new Date().toISOString(),
        });
      }
    });

    setSuccess(editingIdx !== null ? `${player}'s pick updated!` : `${player}'s pick locked in!`);
    setEditingIdx(null);
    setPlayer('');
    setGame('');
    setPickText('');
    setOdds('-110');
    setTimeout(() => setSuccess(''), 3000);
  }

  return (
    <div>
      {locked ? (
        <div className="deadline-banner">
          <div className="deadline-text">⏰ PICKS ARE LOCKED</div>
          <div style={{fontSize:12,color:'var(--text2)',marginTop:4}}>Deadline passed: Saturday 9:00 AM</div>
        </div>
      ) : (
        <div className="deadline-banner" style={{background:'linear-gradient(135deg, #ffc10720 0%, #ff980020 100%)', borderColor:'var(--gold)'}}>
          <div className="deadline-text" style={{color:'var(--gold)'}}>⏰ DEADLINE: SATURDAY 9:00 AM</div>
          <div className="countdown">{countdown}</div>
        </div>
      )}

      {/* Live picks */}
      {weekData.picks.length > 0 && (
        <div className="card">
          <div className="card-title">📡 Live Picks — Week {data.currentWeek}</div>
          {weekData.picks.map((p, i) => (
            <div className="pick-card" key={i}>

// ─── LEADERBOARD TAB ──────────────────────────────────────────
function LeaderboardTab({ data }) {
  const BET_SIZE = 5; // $5 per pick per week

  const playerStats = data.players.map(player => {
    let wins = 0, losses = 0, totalWagered = 0, totalReturned = 0;
    let currentStreak = 0, streak = 0, streakType = '';
    let bestHit = 0; // biggest single-pick payout

    Object.keys(data.weeks).sort((a,b) => a - b).forEach(w => {
      const pick = (data.weeks[w].picks || []).find(p => p.player === player);
      if (pick && pick.result !== 'pending') {
        totalWagered += BET_SIZE;
        if (pick.result === 'won') {
          wins++;
          const payout = BET_SIZE * americanToDecimal(pick.odds);
          totalReturned += payout;
          bestHit = Math.max(bestHit, payout);
          if (streakType === 'W') { streak++; }
          else { streak = 1; streakType = 'W'; }
        } else {
          losses++;
          // $0 returned on a loss
          if (streakType === 'L') { streak++; }
          else { streak = 1; streakType = 'L'; }
        }
        currentStreak = streak;
      }
    });

    const total = wins + losses;
    const profit = totalReturned - totalWagered;
    const roi = totalWagered > 0 ? (profit / totalWagered * 100) : 0;
    return { player, wins, losses, total, totalWagered, totalReturned, profit, roi, bestHit, currentStreak, streakType };
  });

  // Sort by profit (total earnings), then by ROI as tiebreaker
  playerStats.sort((a, b) => b.profit - a.profit || b.roi - a.roi);

  // Find who has played at least one week
  const activePlayers = playerStats.filter(p => p.total > 0);

  const hottest = [...playerStats].filter(p => p.total > 0 && p.streakType === 'W')
    .sort((a,b) => b.currentStreak - a.currentStreak);

  const coldest = [...playerStats].filter(p => p.total > 0 && p.streakType === 'L')
    .sort((a,b) => b.currentStreak - a.currentStreak);

  return (
    <div>
      {/* Hot / Cold */}
      {activePlayers.length > 0 && (
        <div className="stat-row">
          <div className="stat-box" style={{textAlign:'left'}}>
            <div className="stat-label">🔥 Who's Hot</div>
            {hottest.length > 0 ? (
              <div style={{marginTop:4}}>
                <span style={{fontWeight:700,fontSize:14}}>{hottest[0].player}</span>
                <span className="badge-hot" style={{marginLeft:6}}>{hottest[0].currentStreak}W streak</span>
              </div>
            ) : (
              <div style={{fontSize:12,color:'var(--text2)',marginTop:4}}>Nobody hot rn</div>
            )}
          </div>
          <div className="stat-box" style={{textAlign:'left'}}>
            <div className="stat-label">🧊 Who Sucked</div>
            {coldest.length > 0 ? (
              <div style={{marginTop:4}}>
                <span style={{fontWeight:700,fontSize:14}}>{coldest[0].player}</span>
                <span className="badge-cold" style={{marginLeft:6}}>{coldest[0].currentStreak}L streak</span>
              </div>
            ) : (
              <div style={{fontSize:12,color:'var(--text2)',marginTop:4}}>Everyone holding</div>
            )}
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-title">🏆 Leaderboard</div>
        <div style={{fontSize:11,color:'var(--text2)',marginBottom:10}}>
          Ranked by earnings — each pick is a $5 bet at your odds. Win = $5 × odds payout. Loss = $0.
        </div>
        {playerStats.map((p, i) => {
          const isFirst = i === 0 && p.total > 0;
          const isLast = i === playerStats.length - 1 && p.total > 0 && activePlayers.length > 1;
          return (
          <div className="lb-row" key={p.player} style={isFirst ? {background:'var(--green-dim)',borderRadius:8,padding:'10px 8px'} : isLast ? {background:'var(--red-dim)',borderRadius:8,padding:'10px 8px'} : {}}>
            <div className={`lb-rank ${i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'normal'}`}>
              {i + 1}
            </div>
            <div className="lb-name" style={{minWidth:0}}>
              <div>
                {p.player}
                {isFirst && <span className="badge-hot" style={{marginLeft:6,fontSize:10}}>+$100</span>}
                {isLast && <span className="badge-cold" style={{marginLeft:6,fontSize:10}}>owes $100</span>}
                {p.currentStreak >= 3 && p.streakType === 'W' && <span className="badge-hot" style={{marginLeft:6,fontSize:10}}>🔥 {p.currentStreak}W</span>}
                {p.currentStreak >= 3 && p.streakType === 'L' && <span className="badge-cold" style={{marginLeft:6,fontSize:10}}>🧊 {p.currentStreak}L</span>}
              </div>
              <div style={{fontSize:11,color:'var(--text2)'}}>{p.wins}-{p.losses} • ${p.totalWagered} bet → ${p.totalReturned.toFixed(2)} back</div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div className={`lb-pct ${p.profit > 0 ? 'green' : p.profit < 0 && p.total > 0 ? 'red' : ''}`} style={{color: p.total === 0 ? 'var(--text2)' : undefined, width:'auto'}}>
                {p.total > 0 ? `${p.profit >= 0 ? '+' : ''}$${p.profit.toFixed(2)}` : '—'}
              </div>
              {p.total > 0 && <div style={{fontSize:10,color:'var(--text2)'}}>{p.roi >= 0 ? '+' : ''}{Math.round(p.roi)}% ROI</div>}
            </div>
          </div>
          );
        })}
        <div style={{fontSize:11,color:'var(--text2)',textAlign:'center',marginTop:8,fontStyle:'italic'}}>
          Last place owes first place $100 at end of season
        </div>
      </div>
    </div>
  );
}

            <div key={i} style={{marginBottom:8}}>
              <div className="pick-card" style={{flexWrap:'wrap',marginBottom:0}}>
                <div className="pick-avatar" style={{background: AVATAR_COLORS[data.players.indexOf(p.player) % AVATAR_COLORS.length] + '30', color: AVATAR_COLORS[data.players.indexOf(p.player) % AVATAR_COLORS.length], width:32,height:32,fontSize:12}}>
                  {getInitials(p.player)}
                </div>
                <div className="pick-info" style={{minWidth:0}}>
                  <div className="pick-player" style={{fontSize:13}}>{p.player}</div>
                  <div className="pick-detail">{p.game} • {p.pickText} ({formatOdds(p.odds)})</div>
                  {p.commishNote && <div style={{fontSize:11,color:'var(--gold)',marginTop:2,fontStyle:'italic'}}>📝 {p.commishNote}</div>}
                </div>
                <div style={{display:'flex',gap:4,flexShrink:0,alignItems:'center'}}>
                  <button className="btn btn-small" style={{background:'var(--blue-dim)',color:'var(--blue)',padding:'4px 8px',fontSize:11}} onClick={() => {
                    if (editPickIdx === i) { setEditPickIdx(null); }
                    else { setEditPickIdx(i); setEditPickText(p.pickText); setEditOdds(String(p.odds)); setEditNote(p.commishNote || ''); }
                  }}>✏️</button>
                  <button className={`btn btn-small ${p.result === 'won' ? 'btn-green' : ''}`} style={p.result !== 'won' ? {background:'var(--green-dim)',color:'var(--green)'} : {}} onClick={() => {
                    update(d => { d.weeks[weekView].picks[i].result = p.result === 'won' ? 'pending' : 'won'; });
                  }}>W</button>
                  <button className={`btn btn-small ${p.result === 'lost' ? 'btn-red' : ''}`} style={p.result !== 'lost' ? {background:'var(--red-dim)',color:'var(--red)'} : {}} onClick={() => {
                    update(d => { d.weeks[weekView].picks[i].result = p.result === 'lost' ? 'pending' : 'lost'; });
                  }}>L</button>
                </div>
              </div>
              {editPickIdx === i && (
                <div style={{background:'var(--surface)',border:'1px solid var(--blue)',borderRadius:'0 0 10px 10px',padding:12}}>
                  <div style={{fontSize:11,fontWeight:700,color:'var(--blue)',marginBottom:8,textTransform:'uppercase',letterSpacing:1}}>Edit Pick — {p.player}</div>
                  <div className="form-group" style={{marginBottom:8}}>
                    <label className="form-label">Pick</label>
                    <input type="text" value={editPickText} onChange={e => setEditPickText(e.target.value)} style={{padding:8,fontSize:13}} />
                  </div>
                  <div className="form-group" style={{marginBottom:8}}>
                    <label className="form-label">Odds</label>
                    <input type="text" value={editOdds} onChange={e => setEditOdds(e.target.value)} style={{padding:8,fontSize:13}} />
                  </div>
                  <div className="form-group" style={{marginBottom:8}}>
                    <label className="form-label">Commish Note (visible to all)</label>
                    <input type="text" value={editNote} onChange={e => setEditNote(e.target.value)} placeholder="e.g., Odds moved from -110 to -130 at book" style={{padding:8,fontSize:13}} />
                  </div>
                  <div style={{display:'flex',gap:8}}>
                    <button className="btn btn-gold btn-small" onClick={() => {
                      const parsedOdds = parseInt(editOdds);
                      if (isNaN(parsedOdds) || parsedOdds === 0 || (parsedOdds > -100 && parsedOdds < 100)) {
                        setMsg('Invalid odds'); setTimeout(() => setMsg(''), 2000); return;
                      }
                      update(d => {
                        const pick = d.weeks[weekView].picks[i];
                        pick.pickText = editPickText.trim();
                        pick.odds = parsedOdds;
                        pick.commishNote = editNote.trim() || undefined;
                      });
                      setEditPickIdx(null);
                      setMsg('Pick updated!'); setTimeout(() => setMsg(''), 2000);
                    }}>Save Changes</button>
                    <button className="btn btn-small" style={{background:'var(--surface2)',color:'var(--text2)'}} onClick={() => setEditPickIdx(null)}>Cancel</button>
                  </div>
                </div>
              )}
            </div>
          ))
        )}

        {weekPicks.length > 0 && (
          <div style={{marginTop:12}}>
            <div className="form-group">
              <label className="form-label">Parlay Payout ($)</label>
              <input type="number" value={payoutInput} onChange={e => setPayoutInput(e.target.value)} placeholder="0.00" />
            </div>
            <button className="btn btn-gold btn-small" onClick={() => {
              update(d => {
                if (!d.weeks[weekView]) d.weeks[weekView] = { picks: [], result: null, payout: 0 };
                d.weeks[weekView].payout = parseFloat(payoutInput) || 0;
              });
              setMsg('Payout saved!');
              setTimeout(() => setMsg(''), 2000);
            }}>Save Payout</button>
          </div>
        )}
      </div>

      {/* Delete week picks */}
      <div className="card">
        <div className="card-title" style={{color:'var(--red)'}}>🗑️ Danger Zone</div>
        <button className="btn btn-small" style={{background:'var(--red-dim)',color:'var(--red)'}} onClick={() => {
          if (confirm(`Delete all picks for Week ${weekView}?`)) {
            update(d => { delete d.weeks[weekView]; });
          }
        }}>Clear Week {weekView} Picks</button>
        <button className="btn btn-small" style={{background:'var(--red-dim)',color:'var(--red)',marginTop:6}} onClick={() => {
          if (confirm('Reset ALL season data? This cannot be undone.')) {
            update(d => { d.weeks = {}; });
          }
        }}>Reset Entire Season</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
